name: Packages CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/packages-ci.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'

permissions:
  contents: read
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    needs: test-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com
          scope: '@aerorf'
      - run: npm ci
      - run: npm run build
      - run: npm publish -w @aerorf/shared --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm publish -w @aerorf/business-rules --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
